name: Android Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release App Bundle
        run: ./gradlew bundleRelease

      - name: Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Verify signing key fingerprint
        run: |
          EXPECTED_SHA1="81:28:9A:CD:FB:35:BE:DD:34:08:DD:FB:56:57:C7:2F:BD:60:29:B4"
          BUNDLE_PATH="${{ steps.sign_aab.outputs.signedReleaseFile }}"
          # Extract the certificate from the signed bundle and check its SHA1
          unzip -p "$BUNDLE_PATH" META-INF/*.RSA | keytool -printcert | grep -i "SHA1" | tee /tmp/cert_fingerprint.txt
          ACTUAL_SHA1=$(grep -oP '(?<=SHA1: )[\w:]+' /tmp/cert_fingerprint.txt | tr '[:lower:]' '[:upper:]')
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "ERROR: Signing key mismatch!"
            echo "Expected SHA1: $EXPECTED_SHA1"
            echo "Actual   SHA1: $ACTUAL_SHA1"
            echo ""
            echo "Ensure the ANDROID_SIGNING_KEY secret contains the keystore"
            echo "whose certificate fingerprint is SHA1: $EXPECTED_SHA1"
            exit 1
          fi
          echo "Signing key fingerprint verified: $ACTUAL_SHA1"

      - name: Upload signed App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-app-bundle
          path: ${{ steps.sign_aab.outputs.signedReleaseFile }}
